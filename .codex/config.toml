# Shared project settings. Personal models, MCP and permissions stay in ~/.codex.
[agents.wealth-pillar-maintainer]
description = "Implement assigned Wealth Pillar changes."
config_file = "agents/wealth-pillar-maintainer.toml"

[agents.wealth-pillar-reviewer]
description = "Review Wealth Pillar financial, authorization and regression defects."
config_file = "agents/wealth-pillar-reviewer.toml"

