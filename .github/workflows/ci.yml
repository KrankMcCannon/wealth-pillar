name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select affected tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unit: ${{ steps.selection.outputs.unit }}
      has_unit: ${{ steps.selection.outputs.has_unit }}
      integration: ${{ steps.selection.outputs.integration }}
      has_integration: ${{ steps.selection.outputs.has_integration }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/ci/*.test.mjs
      - id: selection
        run: node scripts/ci/plan-tests.mjs
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_EVENT_NAME: ${{ github.event_name }}

  checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: keys
        run: node scripts/ci/cache-keys.mjs
      - uses: actions/cache@v4
        id: eslint_cache
        with:
          path: .eslintcache
          key: ${{ steps.keys.outputs.eslint_key }}
          restore-keys: ${{ steps.keys.outputs.eslint_prefix }}
      - uses: actions/cache@v4
        id: types_cache
        with:
          path: tsconfig.tsbuildinfo
          key: ${{ steps.keys.outputs.types_key }}
          restore-keys: ${{ steps.keys.outputs.types_prefix }}
      - run: node scripts/ci/cache-summary.mjs
        env:
          ESLINT_HIT: ${{ steps.eslint_cache.outputs.cache-hit }}
          TYPES_HIT: ${{ steps.types_cache.outputs.cache-hit }}
      - run: pnpm exec eslint . --cache --cache-strategy content
      - run: pnpm typecheck
      - run: node scripts/check-financial-dates.mjs

  unit:
    needs: plan
    if: ${{ needs.plan.outputs.has_unit == 'true' }}
    name: Unit (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.unit) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci/run-tests.mjs
        env:
          TEST_PROJECT: ${{ matrix.project }}
          TEST_FILES: ${{ toJSON(matrix.files) }}

  integration:
    needs: plan
    if: ${{ needs.plan.outputs.has_integration == 'true' }}
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: wealth_pillar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci/run-tests.mjs
        env:
          TEST_FILES: ${{ needs.plan.outputs.integration }}
          DATABASE_URL: postgres://postgres:${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/wealth_pillar_test

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: keys
        run: node scripts/ci/cache-keys.mjs
      - uses: actions/cache@v4
        id: next_cache
        with:
          path: .next/cache
          key: ${{ steps.keys.outputs.next_key }}
          restore-keys: ${{ steps.keys.outputs.next_prefix }}
      - run: node scripts/ci/cache-summary.mjs
        env:
          NEXT_HIT: ${{ steps.next_cache.outputs.cache-hit }}
      - run: pnpm build
        env:
          # Synthetic credentials; this job has no production access or database service.
          DATABASE_URL: postgres://postgres:${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/wealth_pillar_test
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_ci_build_not_a_real_key

  quality:
    name: Quality
    if: ${{ always() }}
    needs: [plan, checks, unit, integration, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - name: Require every validation to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          HAS_UNIT: ${{ needs.plan.outputs.has_unit }}
          HAS_INTEGRATION: ${{ needs.plan.outputs.has_integration }}
        run: node scripts/ci/quality.mjs
